id: celica-street-build
name: Celica Street Build
repository: wildc4t-workshop/celica-street-build
repository_type: engineering-project
status: active
phase: selected
checkpoint: 2026-09-07

task_prefix: STREET-
decision_prefix: DEC-STREET-

objective: >-
  Complete the final major drivetrain and controls build of the 2000 Celica GT-S
  as a reliable, refined turbo street car with approximately 500 whp maximum
  capability, while keeping normal operation conservative, street-friendly,
  serviceable, and easy to live with.

current_direction:
  - Keep the current car intact and usable while the replacement drivetrain package is developed offline.
  - Use the spare Celica subframe as the drivetrain integration buck rather than trying to duplicate every chassis-side supporting system.
  - Preserve a pre-EMU electrical/body-function baseline and archive the current PowerFC calibration before removing the known-good PowerFC architecture.
  - Bench-characterize the EMU Black and verify the actual 2ZZ crank/cam trigger strategy before real-car EMU installation.
  - Treat the MWR 2023 supercharged-2ZZ Celica base map as the interim MWR-adapter I/O/integration reference, not as a ready-to-run tune.
  - Treat the Lotus 2ZZ DBW map as a DBW implementation reference, not as Celica wiring authority.
  - Validate the return-style fuel system, EMU Black and DBW together on the current engine using the MWR adapter as an integration bridge.
  - Retain the MWR PCB for body/cluster integration while bypassing selected EMU channels through a dedicated DBW sub-harness at the short EMU-to-MWR extension harness.
  - If late-Celica OEM ETB fitment and bench validation succeed, delete the cable throttle and IAC in Baseline Better; move VVT from H-Bridge 1A to freed AUX6 so H-Bridge 1A/1B can drive the ETB while VVL remains on H-Bridge 2A.
  - Treat the MWR adapter as an interim commissioning/integration tool, not the intended final harness architecture.
  - Build the final configuration around the sleeved/forged 2ZZ, E153, DBW, flex fuel, EMU Black, and a purpose-built custom harness.
  - Develop the custom-harness BOM through factory-document identification followed by physical connector and terminal verification before production quantities are purchased.
  - Use the 2000 Celica EWD as the vehicle-year electrical baseline and use 2005 documentation deliberately for selected late-2ZZ hardware such as DBW and the later knock-sensor architecture.
  - Plan for dedicated external MAP and EMAP sensing and EGT provision while leaving exact sensors ranges CAN expansion and final I/O allocation open until the controls architecture and tuner review are mature.
  - Preserve A/C and factory body/cluster functionality where practical.
  - Target approximately 500 whp maximum capability, with a conservative low-boost street mode as the normal personality.
  - Continue evaluating the modular sidewinder hot-side architecture without treating exploration as commitment.
  - Prefer future refinement and modular turbo changes over another fundamental drivetrain rebuild.

proven_or_owned_baseline:
  - Built sleeved 2ZZ with forged low-compression pistons and upgraded rods.
  - E153 factory-LSD transmission with MWR clutch/flywheel, mounts/adapters, and axles.
  - Complete spare Celica subframe with power-steering rack.
  - ECUMaster EMU Black, ECUMaster printed flying-lead harness, and MWR EMU adapter.
  - EMU Black legacy hardware revision F / CPU revision G is bench-powered, communicating, unlocked, and running V3.061.
  - MWR 2023 supercharged 2ZZ Celica base map recovered from email and converted to V3 for inspection.
  - Lotus 2ZZ DBW reference map available for comparison.
  - MWR return-style fuel hardware with MWR rail, AEM FPR, and AEM fuel pump.
  - 2003-2005 Celica DBW pedal and Corolla 2ZZ intake runners.
  - Used 2003-2005 Celica GT-S 2ZZ OEM ETB ordered 2026-09-07 for 2000-manifold fitment and EMU DBW POC.
  - Moroso upgraded oil pan.
  - Mishimoto radiator already installed on the current car.
  - Current TurboKits.com T28-flanged architecture remains a known viable fallback.
  - Cheap cast TD05-style manifold and 20G turbo are available as development hardware.
  - First-pass unwired Ballenger connector kits for expected OEM 2ZZ and late-DBW engine-device interfaces received 2026-09-01.

received_verify:
  - Ballenger connector kits are stored together in a large ziplock bag on top of the built engine; physical fit and terminal ecosystem verification remain pending.
  - MWR V2-to-V3 conversion log preserves imported/warning state for the recovered Celica base map.
  - OEM late-Celica ETB fitment on the 2000 intake manifold remains pending until the ordered part arrives.

uncertain_verify:
  - Built-engine compression ratio is remembered as approximately 9.5:1.
  - Engine valves are believed to be upgraded stainless valves.
  - Upgraded balancer is believed to be ATI.
  - Check and record built-engine valve clearance before final installation/commissioning.
  - Verify physical MWR extension/PCB routing for HB1A/HB1B/AUX6 before building the DBW bypass harness.

open_architecture:
  - final turbo and hot-side architecture
  - final DBW throttle body and intake/plenum architecture after the OEM late-Celica ETB POC
  - final charge-cooling architecture
  - exact custom-harness topology and final EMU I/O allocation
  - final aftermarket sensor hardware ranges and CAN expansion
  - final protection logic and integrated display strategy
  - detailed chassis-side transfer list for swap day

