id: celica-street-build
name: Celica Street Build
repository: wildc4t-workshop/celica-street-build
repository_type: engineering-project
status: active
phase: baseline-plus
checkpoint: 2026-09-09

task_prefix: STREET-
decision_prefix: DEC-STREET-

objective: >-
  Complete the final major drivetrain and controls build of the 2000 Celica GT-S
  as a reliable, refined turbo street car with approximately 500 whp maximum
  capability while keeping normal operation conservative, serviceable, and easy
  to live with.

program:
  baseline: current-car mechanical work remains in celica-baseline
  baseline_plus: validate fuel, EMU, DBW, flex fuel, lambda, pressure protection, boost control, and MWR body integration on the current engine
  replacement_drivetrain: build the built-2ZZ/E153 package offline on the spare subframe
  final: install the replacement drivetrain with cabin-mounted EMU and full custom harness

baseline_plus_selected:
  vehicle_interface: MWR adapter/PCB retained as interim body/cluster integration bridge
  ecu: legacy EMU Black rev F / CPU G / firmware 3.061
  dbw: 2003-2005 Celica GT-S ETB plus late-Celica pedal, subject to ETB fit and bench validation
  vvt: AUX6 low-side after verified OCV switched-12V conversion
  vvl: H-Bridge 2A
  etb_motor: H-Bridge 1A/1B
  flex_fuel: Radium 20-0589 plus GM/Continental 13507129
  fuel_pressure: Link MIPS 101-0325 150 PSI
  oil_pressure: Link MIPS 101-0325 150 PSI, remote from factory main-gallery port
  lambda: Bosch LSU 4.9 0 258 017 025 / 17025 direct to native EMU WBO
  oil_sandwich: MWR MWR-901465 for turbo feed plus low-pressure warning switch
  boost_control: existing Tru-Boost MAC valve on G22 / Injector 6 with external flyback diode

final_selected_direction:
  engine: built sleeved/forged 2ZZ
  transmission: E153 factory LSD
  harness: purpose-built engine/control harness
  ecu_location: cabin
  dbw: required
  flex_fuel: required
  maf: delete
  map: local external sensor near throttle/manifold interface
  iat: dedicated post-intercooler IAT or justified TMAP
  can_expansion: secondary/development instrumentation such as EMAP, multi-channel EGT, oil temperature, coolant pressure
  ac: retain
  body_cluster: preserve practical factory functionality
  normal_operation: conservative low-boost street calibration

replacement_drivetrain_confirmed:
  engine_builder: Monkeywrench Racing
  invoice: MWR 107098 dated 2010-05-07
  pistons: Mahle MAH-21090-820, 82 mm, 9.0:1 compression
  rods: MWR-350121 4340 H-beam
  main_bearings: MWR-300415 coated 1ZZ/2ZZ set
  rod_bearings: MWR-300421 2ZZ set
  valves: MWR-300820 stainless set of 16
  retainers: MWR-300602 titanium set of 16
  oil_pump_gears: Circuitworx CWX-OP-2ZZ
  e153_install_kit: MWR-410101
  flywheel: MWR-400372 forged steel 2ZZ-to-E153
  clutch: ACT-TM1-XTSS E153/MR2-T
  clutch_pushrod: SSI-CLROD-ZZ Speed Source
  clutch_line: SSI-CLL-CELI7 Speed Source stainless
  historical_turbo: Garrett GT3082R / GT30-40, GPP-GT3082R
  record: REPLACEMENT_DRIVETRAIN.md

replacement_drivetrain_current_state:
  adapter_plate: still installed on built 2ZZ
  flywheel_clutch: removed
  starter: believed missing/unaccounted for
  transmission: E153 remains substantially complete and strapped to pallet
  reassembly_rule: inventory hardware and preserve MWR bolt-length/washer-stack locations before mating

owned_or_proven:
  - built sleeved 2ZZ with Mahle 82 mm 9.0:1 pistons and MWR 4340 H-beam rods
  - E153 factory-LSD transmission with MWR clutch/flywheel, mounts/adapters, and axles
  - complete spare Celica subframe with power-steering rack
  - EMU Black, printed flying-lead harness, and MWR adapter
  - MWR 2023 supercharged-2ZZ Celica reference map
  - Lotus 2ZZ DBW reference map
  - MWR return fuel hardware, MWR rail, AEM FPR, and AEM pump
  - existing Tru-Boost MAC boost-control solenoid
  - 2003-2005 Celica DBW pedal
  - used 2003-2005 Celica GT-S ETB ordered 2026-09-07
  - first-pass Ballenger OEM connector verification kits received 2026-09-01
  - Moroso oil pan
  - Mishimoto radiator
  - current TurboKits.com T28-flanged architecture as known fallback
  - cheap TD05-style manifold and 20G as development hardware

verify_before_baseline_plus_install:
  - ETB fit on 2000 intake manifold
  - MWR jumper and OCV+/OCV- routing before DBW/VVT repinning
  - actual fuel-feed hose size before Radium end adapters
  - oil-pressure remote-sender bracket and hose length
  - low-pressure warning-switch sandwich-plate arrangement
  - ETB/pedal connector physical fit
  - Baseline Plus IAT source/path through factory MAF/MWR architecture
  - MAC coil/suppression behavior and de-energized base-boost plumbing

verify_before_final_install:
  - harmonic balancer make/model
  - built-engine valve clearance
  - starter disposition/replacement for MWR E153 package
  - E153 conversion hardware inventory and fastener grade/thread-pitch verification
  - actual flywheel bolt type and pressure-plate bolt specification
  - final MAP and IAT/TMAP hardware
  - final custom-harness I/O/CAN allocation

open_architecture:
  - final turbo/hot-side architecture
  - final intake/plenum/throttle-body architecture after ETB POC
  - final charge-cooling architecture
  - exact final external MAP and IAT/TMAP hardware
  - CAN expansion hardware and secondary instrumentation set
  - final protection thresholds and integrated display strategy
  - detailed chassis-side transfer list

dashboard:
  task_file: tasks.csv
  purchase_file: purchases.csv
  durable_state: PROJECT.md
  agent_instructions: AGENTS.md
  baseline_plus_record: BASELINE_PLUS.md
  pre_emu_baseline: PRE_EMU_BASELINE.md
  emu_commissioning_record: EMU_COMMISSIONING.md
  harness_connector_register: HARNESS_CONNECTORS.md
  final_sensor_topology: FINAL_SENSOR_TOPOLOGY.md
  replacement_drivetrain_record: REPLACEMENT_DRIVETRAIN.md
